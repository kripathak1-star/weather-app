<script type="module">
import * as THREE from 'three';

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.domElement.id = 'gl';
document.body.appendChild(renderer.domElement);
const out = document.createElement('canvas'); out.width = W; out.height = H; document.body.appendChild(out);
const ctx = out.getContext('2d');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 5000);

// ---------- utils ----------
const mkRng = s => () => ((s = (s * 16807) % 2147483647) / 2147483647);
const rand = mkRng(1337);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
function camPath(keys, t) { // keys: [time, pos[], look[]]
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const [t0, p0, l0] = keys[i], [t1, p1, l1] = keys[i + 1], k = ease(seg(t, t0, t1));
  camera.position.lerpVectors(V(...p0), V(...p1), k);
  camera.up.set(0, 1, 0);
  camera.lookAt(V(...l0).lerp(V(...l1), k));
}
function softTex(inner = '#fff', outer = 'rgba(255,255,255,0.3)') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, inner); g.addColorStop(0.25, inner); g.addColorStop(0.6, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}
const SOFT = softTex('rgba(255,255,255,1)', 'rgba(255,255,255,0.25)');

// GLSL noise
const NOISE = `
vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.0+2.0*fract(sin(p)*43758.5453);}
float noise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);vec3 u=f*f*(3.0-2.0*f);
return mix(mix(mix(dot(hash3(i),f),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.03;a*=0.5;}return v;}`;

// JS value noise for terrain
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm2(x, y) { let v = 0, a = 0.5; for (let i = 0; i < 6; i++) { v += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; } return v; }

// =====================================================================
// SPACE: stars, planet, atmosphere, sun, towers, orbit clouds, aurora
// =====================================================================
const space = new THREE.Group(); scene.add(space);
{
  const n = 5000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 600 + rand() * 900, th = rand() * Math.PI * 2, ph = Math.acos(2 * rand() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  space.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: false, fog: false })));
}
const sunDir = V(0.45, 0.5, 1).normalize();
const PU = { uTime: { value: 0 }, uSun: { value: sunDir }, uStorm: { value: 0 }, uHurr: { value: 0 }, uHurC: { value: V(0.5, 0.35, 0.8).normalize() }, uFlash: { value: 0 } };
const planet = new THREE.Mesh(new THREE.SphereGeometry(10, 160, 160), new THREE.ShaderMaterial({
  uniforms: PU,
  vertexShader: `varying vec3 vN; varying vec3 vP; void main(){vN=normalize(normalMatrix*normal);vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: NOISE + `
    uniform float uTime,uStorm,uHurr,uFlash; uniform vec3 uSun,uHurC; varying vec3 vN; varying vec3 vP;
    vec3 rotA(vec3 v, vec3 k, float a){return v*cos(a)+cross(k,v)*sin(a)+k*dot(k,v)*(1.0-cos(a));}
    void main(){
      vec3 p=normalize(vP);
      float h=fbm(p*2.2);
      vec3 ocean=mix(vec3(0.01,0.05,0.18),vec3(0.02,0.2,0.38),smoothstep(-0.3,0.05,h));
      vec3 land=mix(vec3(0.12,0.36,0.12),vec3(0.48,0.4,0.24),smoothstep(0.1,0.35,h));
      land=mix(land,vec3(0.95),smoothstep(0.75,0.9,abs(p.y)));
      vec3 col=h>0.05?land:ocean;
      float dh=distance(p,uHurC);
      float sw=uHurr*exp(-dh*5.0);
      vec3 pc=rotA(p,uHurC,sw*9.0+uTime*0.6*sw);
      vec3 q=pc*3.0+vec3(uTime*0.05,0.0,uTime*0.03);
      float c=fbm(q+fbm(q*1.5+uTime*0.1));
      float cloud=smoothstep(0.0-uStorm*0.25,0.35,c);
      vec3 t1=normalize(cross(uHurC,vec3(0.0,1.0,0.01))); vec3 t2=cross(uHurC,t1);
      float ang=atan(dot(p,t2),dot(p,t1));
      float arms=0.5+0.5*sin(ang*2.0+log(dh+0.002)*7.0-uTime*1.5);
      cloud=max(cloud,uHurr*smoothstep(0.5,0.08,dh)*smoothstep(0.35,0.85,arms+c*0.6));
      cloud*=mix(1.0,smoothstep(0.025,0.06,dh),uHurr);
      col=mix(col,mix(vec3(1.0),vec3(0.38,0.4,0.48),uStorm),cloud*0.88);
      vec3 wn=normalize((viewMatrix*vec4(uSun,0.0)).xyz);
      float d=max(dot(vN,wn),0.0);
      vec3 night=vec3(1.0,0.75,0.35)*smoothstep(0.15,0.3,h)*step(h,0.6)*0.7*(1.0-cloud);
      col=col*(0.04+d*1.1)+night*smoothstep(0.2,-0.1,dot(vN,wn));
      float spec=pow(max(dot(reflect(-wn,vN),vec3(0,0,1)),0.0),40.0)*(h<0.05?1.0:0.0)*(1.0-cloud);
      col+=spec*0.6;
      col+=uFlash*cloud*vec3(0.7,0.8,1.0);
      gl_FragColor=vec4(col,1.0);
    }`
}));
space.add(planet);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(10.9, 96, 96), new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { uCol: { value: new THREE.Color(0.3, 0.6, 1.0) } },
  vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `uniform vec3 uCol; varying vec3 vN; void main(){float i=clamp(pow(max(0.72-dot(vN,vec3(0,0,1.0)),0.0),3.0),0.0,0.45);gl_FragColor=vec4(uCol*i*2.2,1.0);}`
}));
space.add(atmo);
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex('#fff', 'rgba(255,170,60,0.35)'), blending: THREE.AdditiveBlending, fog: false }));
sun.scale.set(130, 130, 1); space.add(sun);

// city towers (sample data)
const CITIES = [
  ['Tokyo', 35.7, 139.7, 18], ['New York', 40.7, -74, 12], ['London', 51.5, -0.1, 9], ['Delhi', 28.6, 77.2, 31],
  ['Sydney', -33.9, 151.2, 24], ['Rio de Janeiro', -22.9, -43.2, 29], ['Cairo', 30, 31.2, 27], ['Moscow', 55.7, 37.6, -2],
  ['Paris', 48.9, 2.35, 11], ['Cape Town', -33.9, 18.4, 21], ['Mumbai', 19.1, 72.9, 33], ['Reykjavik', 64.1, -21.9, -4]
];
function latLon(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180;
  return V(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}
function labelSprite(text, sub, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(5,10,25,0.78)'; x.strokeStyle = color; x.lineWidth = 5;
  x.beginPath(); x.roundRect(8, 8, 496, 144, 24); x.fill(); x.stroke();
  x.fillStyle = '#fff'; x.font = 'bold 50px sans-serif'; x.textAlign = 'center'; x.fillText(text, 256, 70);
  x.fillStyle = color; x.font = 'bold 48px sans-serif'; x.fillText(sub, 256, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(2.6, 0.8, 1); return s;
}
const towers = new THREE.Group(); planet.add(towers);
const TW = CITIES.map(([name, lat, lon, temp]) => {
  const color = new THREE.Color().setHSL(THREE.MathUtils.mapLinear(temp, -5, 33, 0.6, 0.0), 1, 0.55);
  const hgt = 1 + (temp + 5) / 38 * 3.5, base = latLon(lat, lon, 10);
  const geo = new THREE.CylinderGeometry(0.12, 0.18, 1, 12); geo.translate(0, 0.5, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
  m.position.copy(base); m.quaternion.setFromUnitVectors(V(0, 1, 0), base.clone().normalize());
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.4, 32), new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  ring.position.copy(base.clone().multiplyScalar(1.002)); ring.lookAt(base.clone().multiplyScalar(2));
  const lb = labelSprite(name, `${temp}°C`, '#' + color.getHexString());
  towers.add(m, ring, lb);
  return { name, temp, color, m, ring, lb, base, hgt };
});
const RANK = [...TW].sort((a, b) => a.temp - b.temp); // coldest first

// orbit cloud particles
const OCN = 6000, ocPos = new Float32Array(OCN * 3), ocInfo = [];
for (let i = 0; i < OCN; i++) ocInfo.push({ r: 11.5 + rand() * 3, lat: (rand() - 0.5) * 1.2, a: rand() * Math.PI * 2, sp: 0.1 + rand() * 0.3 });
const ocGeo = new THREE.BufferGeometry(); ocGeo.setAttribute('position', new THREE.BufferAttribute(ocPos, 3));
const ocMat = new THREE.PointsMaterial({ color: 0x9fd8ff, size: 0.06, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
space.add(new THREE.Points(ocGeo, ocMat));

// aurora curtains at north pole
const AU = { uTime: { value: 0 }, uI: { value: 0 } };
const auroraMat = new THREE.ShaderMaterial({
  uniforms: AU, transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  vertexShader: `uniform float uTime; varying vec2 vUv; void main(){vUv=uv; vec3 p=position; float w=sin(uv.x*6.2831*5.0+uTime*0.7)*0.35+sin(uv.x*6.2831*13.0-uTime*1.3)*0.12; p.xz*=1.0+w*0.12; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
  fragmentShader: NOISE + `uniform float uTime,uI; varying vec2 vUv; void main(){
    float n=fbm(vec3(vUv.x*30.0,uTime*0.4,vUv.y*2.0));
    float rays=0.5+0.5*sin(vUv.x*6.2831*60.0+n*6.0+uTime);
    float a=smoothstep(0.0,0.08,vUv.y)*pow(1.0-vUv.y,1.6)*(0.4+0.6*rays)*(0.6+0.8*n);
    vec3 col=mix(vec3(0.1,1.0,0.45),vec3(0.65,0.25,1.0),smoothstep(0.35,0.95,vUv.y));
    gl_FragColor=vec4(col*a*uI*1.6,1.0);}`
});
const aurora = new THREE.Group(); space.add(aurora);
[[3.4, 1.8, 10.6], [4.4, 2.2, 10.2], [2.4, 1.4, 10.8]].forEach(([r, h, y]) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 256, 8, true), auroraMat); m.position.y = y + h / 2; aurora.add(m);
});

// =====================================================================
// SHARED WEATHER FX: rain, snow, lightning
// =====================================================================
const RAIN_N = 7000, rainPos = new Float32Array(RAIN_N * 6), rainBase = [];
for (let i = 0; i < RAIN_N; i++) rainBase.push([(rand() - 0.5) * 70, rand() * 50, (rand() - 0.5) * 70, 0.8 + rand() * 0.6]);
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({ color: 0x9fc2ff, transparent: true, opacity: 0, fog: false });
const rain = new THREE.LineSegments(rainGeo, rainMat); rain.frustumCulled = false; scene.add(rain);
function updateRain(t, intensity, wind = 0.15) {
  rain.visible = intensity > 0; if (!rain.visible) return;
  rainMat.opacity = intensity * 0.55;
  const c = camera.position;
  rainBase.forEach(([x, y, z, s], i) => {
    const yy = ((y - t * 35 * s) % 50 + 50) % 50 - 25;
    const px = c.x + x + yy * wind, pz = c.z + z, py = c.y + yy;
    rainPos.set([px, py, pz, px - wind * 1.4, py - 1.4, pz], i * 6);
  });
  rainGeo.attributes.position.needsUpdate = true;
}
const SNOW_N = 16000, snowPos = new Float32Array(SNOW_N * 3), snowBase = [];
for (let i = 0; i < SNOW_N; i++) snowBase.push([rand() * 120, rand() * 80, rand() * 120, 0.5 + rand(), rand() * 6.28]);
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snowMat = new THREE.PointsMaterial({ map: SOFT, color: 0xffffff, size: 0.55, transparent: true, opacity: 0, depthWrite: false, fog: false });
const snow = new THREE.Points(snowGeo, snowMat); snow.frustumCulled = false; scene.add(snow);
function updateSnow(t, intensity, wind = 12) {
  snow.visible = intensity > 0; if (!snow.visible) return;
  snowMat.opacity = intensity;
  const c = camera.position, m = (v, n) => ((v % n) + n) % n;
  snowBase.forEach(([x, y, z, s, ph], i) => {
    snowPos.set([
      c.x - 60 + m(x + t * wind * s - c.x, 120) + Math.sin(t * 2 + ph) * 0.5,
      c.y - 40 + m(y - t * 6 * s - c.y, 80),
      c.z - 60 + m(z + Math.sin(t * 0.7 + ph) * 3 - c.z, 120)], i * 3);
  });
  snowGeo.attributes.position.needsUpdate = true;
}
const boltMat = new THREE.LineBasicMaterial({ color: 0xe0ecff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, fog: false });
const bolts = [0, 1].map(() => { const l = new THREE.Line(new THREE.BufferGeometry(), boltMat); l.frustumCulled = false; scene.add(l); return l; });
function makeBolt(seedN, from, to, jit) {
  const r = mkRng(seedN * 7919 + 13), pts = [], N = 26;
  for (let i = 0; i <= N; i++) {
    const p = from.clone().lerp(to, i / N);
    if (i > 0 && i < N) p.add(V((r() - 0.5) * jit, (r() - 0.5) * jit * 0.3, (r() - 0.5) * jit));
    pts.push(p);
  }
  bolts[0].geometry.setFromPoints(pts);
  const k = 8 + Math.floor(r() * 8), bp = [pts[k].clone()], dir = to.clone().sub(from).multiplyScalar(0.4 / N);
  for (let i = 0; i < 10; i++) bp.push(bp[i].clone().add(dir).add(V((r() - 0.3) * jit * 1.2, 0, (r() - 0.5) * jit)));
  bolts[1].geometry.setFromPoints(bp);
}
// returns flash intensity 0..1 and draws the bolt for scheduled strikes
function strikes(times, lt, spawn) {
  let f = 0, which = -1;
  times.forEach((s, i) => { const d = lt - s; if (d >= 0 && d < 0.22) { const v = (1 - d / 0.22) * (d < 0.05 || d > 0.09 ? 1 : 0.4); if (v > f) { f = v; which = i; } } });
  if (which >= 0) { spawn(which); bolts.forEach(b => b.visible = true); boltMat.opacity = f; }
  return f;
}

// =====================================================================
// HURRICANE scene (far away at x=+3000)
// =====================================================================
const HUR = V(3000, 0, 0);
const hurricane = new THREE.Group(); hurricane.position.copy(HUR); scene.add(hurricane);
const fogU = { uFogCol: { value: new THREE.Color() }, uFogD: { value: 0.002 } };
const oceanFlat = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, ...fogU },
  vertexShader: `varying vec3 vW; void main(){vW=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.0);}`,
  fragmentShader: NOISE + `uniform float uTime,uFogD; uniform vec3 uFogCol; varying vec3 vW; void main(){
    float n=fbm(vec3(vW.xz*0.03,uTime*0.2));
    vec3 col=mix(vec3(0.01,0.05,0.12),vec3(0.05,0.16,0.26),n*0.5+0.5);
    float d=length(vW-cameraPosition); col=mix(col,uFogCol,1.0-exp(-d*uFogD));
    gl_FragColor=vec4(col,1.0);}`
}));
hurricane.add(oceanFlat);
const HN = 26000, hPos = new Float32Array(HN * 3), hCol = new Float32Array(HN * 3), hInfo = [];
for (let i = 0; i < HN; i++) {
  const wall = rand() < 0.22;
  const r = wall ? 11 + rand() * 12 : 14 + 170 * Math.pow(rand(), 1.4);
  const arm = Math.floor(rand() * 4);
  const th0 = arm * Math.PI / 2 + Math.log(r) * 2.6 + (rand() - 0.5) * 0.7 * (1 + r / 90);
  const y = wall ? 4 + rand() * 26 * (1 - (r - 11) / 14) : 6 + rand() * 7 * (1 - r / 220);
  const b = wall ? 0.95 : 0.55 + 0.4 * (1 - r / 190);
  hCol.set([b, b, b * 1.05], i * 3);
  hInfo.push([r, th0, y, 1.6 / Math.pow(r / 10, 0.75)]);
}
const hGeo = new THREE.BufferGeometry();
hGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3)); hGeo.setAttribute('color', new THREE.BufferAttribute(hCol, 3));
const hMat = new THREE.PointsMaterial({ map: SOFT, size: 13, vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false });
const hPts = new THREE.Points(hGeo, hMat); hPts.frustumCulled = false; hurricane.add(hPts);
function updateHurricane(lt) {
  hInfo.forEach(([r, th0, y, w], i) => { const th = th0 + w * lt * 0.35; hPos.set([Math.cos(th) * r, y, Math.sin(th) * r], i * 3); });
  hGeo.attributes.position.needsUpdate = true;
  oceanFlat.material.uniforms.uTime.value = lt;
}

// =====================================================================
// OCEAN THUNDERSTORM scene (x=-3000)
// =====================================================================
const OCE = V(-3000, 0, 0);
const oceanStorm = new THREE.Group(); scene.add(oceanStorm);
const OU = { uTime: { value: 0 }, uFlash: { value: 0 }, ...fogU };
const waves = new THREE.Mesh(new THREE.PlaneGeometry(700, 700, 260, 260).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: OU,
  vertexShader: `uniform float uTime; varying vec3 vW; varying vec3 vN; varying float vH;
    float Hh(vec2 p){return 1.4*sin(dot(p,vec2(0.08,0.03))+uTime*1.1)+0.9*sin(dot(p,vec2(-0.05,0.11))+uTime*1.5)+0.45*sin(dot(p,vec2(0.21,0.17))+uTime*2.3)+0.25*sin(dot(p,vec2(-0.33,0.27))+uTime*3.1);}
    void main(){vec3 w=(modelMatrix*vec4(position,1.0)).xyz; float h=Hh(w.xz); w.y+=h; vH=h;
      float e=0.6; vN=normalize(vec3(Hh(w.xz-vec2(e,0.0))-Hh(w.xz+vec2(e,0.0)),2.0*e,Hh(w.xz-vec2(0.0,e))-Hh(w.xz+vec2(0.0,e))));
      vW=w; gl_Position=projectionMatrix*viewMatrix*vec4(w,1.0);}`,
  fragmentShader: `uniform float uFlash,uFogD; uniform vec3 uFogCol; varying vec3 vW; varying vec3 vN; varying float vH; void main(){
    vec3 v=normalize(cameraPosition-vW); float fr=pow(1.0-max(dot(v,vN),0.0),4.0);
    vec3 col=mix(vec3(0.01,0.04,0.06),vec3(0.25,0.3,0.36),fr);
    col+=smoothstep(1.6,2.6,vH)*vec3(0.35);
    col+=uFlash*(0.2+fr)*vec3(0.6,0.7,0.95);
    float d=length(vW-cameraPosition); col=mix(col,uFogCol,1.0-exp(-d*uFogD));

      popTxt('PRO WEATHER', lt, 10, 19, 300, 120, '#e0f2fe');
      popTxt('A 10-minute journey through every sky', lt, 11, 19, 410, 40, '#cbd5e1');
      const list = ['1  Coldest to hottest', '2  Inside a hurricane', '3  The aurora', '4  Thunderstorm at sea', '5  The blizzard', '6  Day & night', '7  THE SUPER STORM'];
      const k = win(lt, 20, 33, 0.5);
      if (k > 0) { box(400, 150, 480, 380, 0.6 * k); txt('TODAY ON THE JOURNEY', 640, 190, 30, '#7dd3fc', k, 'center', '800'); }
      list.forEach((s, i) => txt(s, 450, 250 + i * 50, 30, i === 6 ? '#fbbf24' : '#fff', win(lt, 20.6 + i * 0.4, 33, 0.3), 'left', '800'));
    });
  }
  if (c.title) say(() => {
    const k = win(lt, 0.4, 4.6, 0.4);
    if (k <= 0) return;
    txt(`CHAPTER ${c.n}`, 640, 300, 30, '#7dd3fc', k, 'center', '800');
    ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = '#38bdf8'; const w = 300 * ease(seg(lt, 0.4, 1.2)); ctx.fillRect(640 - w / 2, 330, w, 4); ctx.restore();
    txt(c.title, 640, 380, 64, '#fff', k);
  });
  if (c.next) say(() => {
    const L = c.b - c.a, k = win(lt, L - 7, L - 1, 0.5);
    if (k <= 0) return;
    const x = lerp(1300, 860, ease(seg(lt, L - 7, L - 6.4)));
    ctx.save(); ctx.globalAlpha = 0.7 * k; ctx.fillStyle = '#050a19'; ctx.beginPath(); ctx.roundRect(x, 40, 380, 90, 14); ctx.fill(); ctx.restore();
    txt('NEXT UP', x + 24, 68, 20, '#fbbf24', k, 'left', '800');
    txt(c.next, x + 24, 104, 26, '#fff', k, 'left', '800', 340);
  });
  const facts = {
    hurricane: [[8, 18, 'DID YOU KNOW?', 'Category 5 winds start at 252 km/h'], [48, 58, 'DID YOU KNOW?', 'Some hurricanes span over 1,000 km'], [66, 76, 'INSIDE THE EYE', 'The eye can be calm, even sunny']],
    aurora: [[8, 18, 'DID YOU KNOW?', 'Auroras glow 100+ km above the ground'], [32, 42, 'WHY IT GLOWS', 'Solar wind meets our atmosphere']],
    ocean: [[10, 20, 'DID YOU KNOW?', 'Lightning is ~5x hotter than the Sun\'s surface'], [42, 52, 'DID YOU KNOW?', 'Lightning strikes Earth ~44 times a second']],
    blizzard: [[10, 20, 'WHAT MAKES A BLIZZARD?', 'Winds 56+ km/h, visibility under 400 m'], [36, 46, 'FOR HOW LONG?', 'Those conditions must last 3+ hours']],
    daynight: [[8, 18, 'LOOK CLOSELY', 'City lights switch on as night falls'], [30, 40, 'ONE DAY = 24 HOURS', 'Here, a full day passes in ~16 seconds']],
    finale: [[3, 9, 'WARNING', 'Every storm. All at once.']],
  }[c.id];
  if (facts) say(() => facts.forEach(([a, b, h, s]) => lowerThird(lt, a, b, h, s)));
  if (c.id === 'finale') say(() => {
    ['3', '2', '1'].forEach((s, i) => popTxt(s, lt, 5 + i * 0.6, 5.55 + i * 0.6, 360, 160, '#fbbf24'));
    popTxt('The storm passes...', lt, 40, 48, 600, 44, '#e0f2fe');
  });
  if (c.id === 'aurora') say(() => {
    const L = c.b - c.a, k = win(lt, L - 7, L - 1, 0.5);
    popTxt('Halfway point next... don\'t leave now', lt, L - 6, L - 0.5, 640, 34, '#fde68a');
    void k;
  });
}
function progressBar(t) {
  const y = 708, w = 1280;
  ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, y, w, 6);
  ctx.fillStyle = '#ef4444'; ctx.fillRect(0, y, w * t / DURATION, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  CH.forEach(c => { if (c.a > 0) ctx.fillRect(w * c.a / DURATION - 1, y, 2, 6); });
  ctx.restore();
}

window.renderFrame = (t) => {
  t = clamp(t, 0, DURATION - 1e-3);
  const c = CH.find(c => t >= c.a && t < c.b), lt = t - c.a;
  OV = []; FLASH2D = 0;
  reset();
  FN[c.id](lt);
  chapterOverlay(c, lt, t);
  renderer.render(scene, camera);
  ctx.globalAlpha = 1; ctx.drawImage(renderer.domElement, 0, 0);
  // cinematic vignette
  const vg = ctx.createRadialGradient(640, 360, 300, 640, 360, 800); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (FLASH2D > 0) { ctx.fillStyle = `rgba(235,242,255,${FLASH2D})`; ctx.fillRect(0, 0, W, H); }
  // fades between chapters
  const fade = Math.min(seg(t, c.a, c.a + 0.6), 1 - seg(t, c.b - 0.6, c.b));
  const fadeA = (c.a === 0 ? 1 : fade) * (c.b === DURATION ? Math.min(1, (DURATION - t) / 1.5) : 1);
  if (fadeA < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fadeA})`; ctx.fillRect(0, 0, W, H); }
  OV.forEach(f => f());
  if (t > 20) progressBar(t);
};
window.DURATION = DURATION;
window.ready = true;

const q = new URLSearchParams(location.search);
if (!q.has('capture')) {
  const start = performance.now(), off = Number(q.get('t') || 0);
  (function loop() { renderFrame((off + (performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
