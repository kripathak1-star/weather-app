<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weather Planet 3D</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const W = 1280, H = 720, DURATION = 12;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02030a, 0.008);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 2000);

// ---------- deterministic random ----------
let seed = 1337;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---------- starfield ----------
{
  const n = 4000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 300 + rand() * 700, th = rand() * Math.PI * 2, ph = Math.acos(2 * rand() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: false, fog: false })));
}

// ---------- planet (procedural shader) ----------
const noise = `
vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.0+2.0*fract(sin(p)*43758.5453);}
float noise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);vec3 u=f*f*(3.0-2.0*f);
return mix(mix(mix(dot(hash3(i),f),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.03;a*=0.5;}return v;}`;

const sunDir = new THREE.Vector3(0.45, 0.5, 1).normalize();
const planetU = { uTime: { value: 0 }, uSun: { value: sunDir }, uStorm: { value: 0 } };
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(10, 128, 128),
  new THREE.ShaderMaterial({
    uniforms: planetU,
    vertexShader: `varying vec3 vN; varying vec3 vP; void main(){vN=normalize(normalMatrix*normal);vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: noise + `
      uniform float uTime; uniform vec3 uSun; uniform float uStorm; varying vec3 vN; varying vec3 vP;
      void main(){
        vec3 p=normalize(vP);
        float h=fbm(p*2.2);
        vec3 ocean=mix(vec3(0.01,0.05,0.18),vec3(0.02,0.18,0.35),smoothstep(-0.3,0.05,h));
        vec3 land=mix(vec3(0.12,0.35,0.12),vec3(0.45,0.38,0.22),smoothstep(0.1,0.35,h));
        land=mix(land,vec3(0.95),smoothstep(0.75,0.9,abs(p.y)));
        vec3 col=h>0.05?land:ocean;
        // swirling clouds
        vec3 q=p*3.0+vec3(uTime*0.05,0.0,uTime*0.03);
        float c=fbm(q+fbm(q*1.5+uTime*0.1));
        float cloud=smoothstep(0.0-uStorm*0.25,0.35,c);
        col=mix(col,mix(vec3(1.0),vec3(0.35,0.38,0.45),uStorm),cloud*0.85);
        vec3 wn=normalize((viewMatrix*vec4(uSun,0.0)).xyz);
        float d=max(dot(vN,wn),0.0);
        vec3 night=vec3(1.0,0.75,0.35)*smoothstep(0.15,0.3,h)*step(h,0.6)*0.6*(1.0-cloud);
        col=col*(0.04+d*1.1)+night*smoothstep(0.2,-0.1,dot(vN,wn));
        float spec=pow(max(dot(reflect(-wn,vN),vec3(0,0,1)),0.0),40.0)*(h<0.05?1.0:0.0)*(1.0-cloud);
        col+=spec*0.6;
        gl_FragColor=vec4(col,1.0);
      }`
  })
);
scene.add(planet);

// atmosphere (fresnel glow)
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(10.9, 96, 96),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `varying vec3 vN; void main(){float i=pow(0.72-dot(vN,vec3(0,0,1.0)),3.0);gl_FragColor=vec4(0.3,0.6,1.0,1.0)*i*2.2;}`
  })
);
scene.add(atmo);

// ---------- sun ----------
function glowTexture(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, inner); g.addColorStop(0.2, inner); g.addColorStop(0.5, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('#fff', 'rgba(255,170,60,0.35)'), blending: THREE.AdditiveBlending, fog: false }));
sun.position.copy(sunDir).multiplyScalar(400); sun.scale.set(120, 120, 1);
scene.add(sun);

// ---------- 3D city temperature towers ----------
const cities = [
  ['Tokyo', 35.7, 139.7, 18], ['New York', 40.7, -74, 12], ['London', 51.5, -0.1, 9], ['Delhi', 28.6, 77.2, 31],
  ['Sydney', -33.9, 151.2, 24], ['Rio', -22.9, -43.2, 29], ['Cairo', 30, 31.2, 27], ['Moscow', 55.7, 37.6, -2],
  ['Paris', 48.9, 2.35, 11], ['Cape Town', -33.9, 18.4, 21], ['Mumbai', 19.1, 72.9, 32], ['Reykjavik', 64.1, -21.9, -4]
];
const towers = new THREE.Group(); planet.add(towers);
const towerData = [];
function latLon(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}
function label(text, sub, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(5,10,25,0.75)'; x.strokeStyle = color; x.lineWidth = 4;
  x.beginPath(); x.roundRect(8, 8, 496, 144, 24); x.fill(); x.stroke();
  x.fillStyle = '#fff'; x.font = 'bold 56px sans-serif'; x.textAlign = 'center'; x.fillText(text, 256, 72);
  x.fillStyle = color; x.font = 'bold 48px sans-serif'; x.fillText(sub, 256, 130);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(2.6, 0.8, 1); return s;
}
for (const [name, lat, lon, temp] of cities) {
  const color = new THREE.Color().setHSL(THREE.MathUtils.mapLinear(temp, -5, 33, 0.6, 0.0), 1, 0.55);
  const hgt = 1 + (temp + 5) / 38 * 3.5;
  const base = latLon(lat, lon, 10);
  const geo = new THREE.CylinderGeometry(0.12, 0.18, 1, 12); geo.translate(0, 0.5, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
  m.position.copy(base); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), base.clone().normalize());
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.4, 32), new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  ring.position.copy(base.clone().multiplyScalar(1.002)); ring.lookAt(base.clone().multiplyScalar(2));
  const lb = label(name, `${temp}°C`, '#' + color.getHexString());
  towers.add(m, ring, lb);
  towerData.push({ m, ring, lb, base, hgt });
}

// ---------- orbiting cloud particles ----------
const cloudN = 6000, cloudPos = new Float32Array(cloudN * 3), cloudInfo = [];
for (let i = 0; i < cloudN; i++) cloudInfo.push({ r: 11.5 + rand() * 3, lat: (rand() - 0.5) * 1.2, a: rand() * Math.PI * 2, sp: 0.1 + rand() * 0.3 });
const cloudGeo = new THREE.BufferGeometry(); cloudGeo.setAttribute('position', new THREE.BufferAttribute(cloudPos, 3));
const cloudMat = new THREE.PointsMaterial({ color: 0x9fd8ff, size: 0.06, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(cloudGeo, cloudMat));

// ---------- rain + storm clouds (finale) ----------
const rainN = 5000, rainPos = new Float32Array(rainN * 6), rainBase = [];
for (let i = 0; i < rainN; i++) rainBase.push([(rand() - 0.5) * 60, rand() * 40, (rand() - 0.5) * 60, 0.8 + rand() * 0.6]);
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({ color: 0x8fb8ff, transparent: true, opacity: 0 });
const rain = new THREE.LineSegments(rainGeo, rainMat); scene.add(rain);

// lightning bolt
const boltMat = new THREE.LineBasicMaterial({ color: 0xd8e6ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
const boltGeo = new THREE.BufferGeometry(); const bolt = new THREE.Line(boltGeo, boltMat); scene.add(bolt);
function makeBolt(s) {
  seed = s; const pts = []; let p = new THREE.Vector3(-4 + rand() * 8, 30, -10);
  for (let i = 0; i < 24; i++) { pts.push(p.clone()); p.add(new THREE.Vector3((rand() - 0.5) * 2.5, -1.3, (rand() - 0.5) * 1.5)); }
  boltGeo.setFromPoints(pts);
}
const flash = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false, blending: THREE.AdditiveBlending }));
flash.renderOrder = 999; scene.add(flash);

// ---------- title ----------
function titleSprite() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 512;
  const x = c.getContext('2d'); x.textAlign = 'center';
  const g = x.createLinearGradient(0, 0, 2048, 0); g.addColorStop(0, '#7dd3fc'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#fbbf24');
  x.shadowColor = '#38bdf8'; x.shadowBlur = 40; x.fillStyle = g; x.font = '900 220px sans-serif'; x.fillText('PRO WEATHER', 1024, 260);
  x.shadowBlur = 0; x.fillStyle = '#cbd5e1'; x.font = '500 72px sans-serif'; x.fillText('Real-time forecasts · Every city · Every sky', 1024, 400);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, opacity: 0, depthTest: false, fog: false }));
  s.renderOrder = 1000; s.scale.set(16, 4, 1); return s;
}
const title = titleSprite(); scene.add(title);

// ---------- timeline helpers ----------
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (t, a, b) => THREE.MathUtils.clamp((t - a) / (b - a), 0, 1);
const camKeys = [ // time, position, lookAt
  [0, [0, 40, 260], [0, 0, 0]],
  [3.5, [8, 6, 34], [0, 0, 0]],
  [6.5, [20, 9, 22], [0, 2, 0]],
  [9, [0, -2, 26], [0, 4, 0]],
  [12, [0, 3, 40], [0, 9, 0]],
];
function cameraAt(t) {
  let i = 0; while (i < camKeys.length - 2 && t > camKeys[i + 1][0]) i++;
  const [t0, p0, l0] = camKeys[i], [t1, p1, l1] = camKeys[i + 1];
  const k = ease(seg(t, t0, t1));
  camera.position.lerpVectors(new THREE.Vector3(...p0), new THREE.Vector3(...p1), k);
  camera.lookAt(new THREE.Vector3(...l0).lerp(new THREE.Vector3(...l1), k));
}

// ---------- render one frame at time t (deterministic) ----------
window.renderFrame = (t) => {
  cameraAt(t);
  planet.rotation.y = t * 0.12 - 1.2;
  atmo.rotation.copy(planet.rotation);
  planetU.uTime.value = t;
  const storm = ease(seg(t, 8, 10));
  planetU.uStorm.value = storm;
  renderer.toneMappingExposure = 1.0 - storm * 0.35;

  // towers grow in 3.5s→6s, staggered
  towerData.forEach((d, i) => {
    const g = ease(seg(t, 3.5 + i * 0.12, 4.6 + i * 0.12));
    d.m.scale.set(1, Math.max(g * d.hgt, 0.001), 1);
    d.ring.scale.setScalar(1 + Math.sin(t * 4 + i) * 0.25);
    d.lb.position.copy(d.base.clone().normalize().multiplyScalar(10 + d.hgt * g + 0.6));
    d.lb.material.opacity = g * (1 - storm);
    d.m.material.opacity = 0.9 * (1 - storm * 0.7);
  });

  // cloud swirl
  cloudMat.opacity = seg(t, 2, 4) * 0.45;
  cloudMat.color.setHSL(0.55, 0.8 - storm * 0.7, 0.75 - storm * 0.3);
  cloudInfo.forEach((c, i) => {
    const a = c.a + t * c.sp * (1 + storm * 2), r = c.r - storm * 0.5;
    cloudPos.set([Math.cos(a) * Math.cos(c.lat) * r, Math.sin(c.lat) * r + Math.sin(a * 3) * 0.3, Math.sin(a) * Math.cos(c.lat) * r], i * 3);
  });
  cloudGeo.attributes.position.needsUpdate = true;

  // rain
  rainMat.opacity = storm * 0.55;
  rainBase.forEach(([x, y, z, s], i) => {
    const yy = ((y - t * 30 * s) % 40 + 40) % 40 - 10 + 4;
    rainPos.set([x + camera.position.x, yy, z, x + camera.position.x - 0.1, yy - 1.2, z], i * 6);
  });
  rainGeo.attributes.position.needsUpdate = true;

  // lightning strikes at fixed times
  const strikes = [9.2, 10.1, 10.25, 11.3];
  let f = 0, which = -1;
  strikes.forEach((s, i) => { const d = t - s; if (d >= 0 && d < 0.18) { f = Math.max(f, 1 - d / 0.18); which = i; } });
  if (which >= 0) makeBolt(100 + which);
  boltMat.opacity = f;
  flash.position.copy(camera.position).add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(1));
  flash.quaternion.copy(camera.quaternion);
  flash.material.opacity = f * 0.18;

  // title
  title.position.copy(camera.position).add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(20));
  title.position.y += 4.8;
  const tt = seg(t, 9.6, 10.8);
  title.material.opacity = ease(tt);
  title.scale.set(16 * (0.85 + 0.15 * ease(tt)), 4 * (0.85 + 0.15 * ease(tt)), 1);

  renderer.render(scene, camera);
};
window.DURATION = DURATION;
window.ready = true;

// live preview when opened normally
if (!location.search.includes('capture')) {
  const start = performance.now();
  (function loop() { renderFrame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
