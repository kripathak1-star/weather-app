const bigBag=makeBag(1.55);bigBag.position.set(0,2.0,0);studio.add(bigBag);
const ringProds=STUDIO6.map((n,i)=>{const p=prod(n,1.2);const h=new THREE.Group();h.add(p);h.scale.setScalar(.75);studio.add(h);return h;});
const ribbons=[0,1,2].map(i=>{const pts=[];for(let k=0;k<=240;k++){const a=k/240*Math.PI*4+i*2.1;pts.push(V(Math.cos(a)*(2.2+.25*Math.sin(a*2)),.6+k/240*3.2+Math.sin(a*3)*.15,Math.sin(a)*(2.2+.25*Math.sin(a*2))));}
  const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),480,.022,8,false);
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:GOLD,emissive:0xffa630,emissiveIntensity:1.3,metalness:1,roughness:.2}));studio.add(m);return m;});

// ---------- Scene 6: finale ----------
const finale=new THREE.Group();scene.add(finale);
const finProds=FIN6.map(n=>{const p=prod(n,1.3);const h=new THREE.Group();h.add(p);h.scale.setScalar(.48);finale.add(h);return h;});
const FIN_POS=[[-1.1,1.25,0],[1.1,1.25,0],[-1.4,.3,.1],[1.4,.3,.1],[-1.1,-.6,.2],[1.1,-.6,.2]];

// ---------- camera path helpers ----------
function look(p,t){camera.position.copy(p);camera.lookAt(t);}
const tmp=V(0,0,0);
function setVis(){}

window.renderAt=function(t){
  // reset visibility
  const S1=t<7.3,S2=t>=6.8&&t<16.3,S3=t>=15.8&&t<25.3,S4=t>=24.8&&t<35.3,S5=t>=34.8&&t<44.3,S6=t>=44;
  parts.visible=t<7.6||(t>=44.2);seedSpark.visible=t<1.6;tunnel.visible=t>1&&t<4.9;shock.visible=t>3.8&&t<5.4;
  logo.visible=(t>4.2&&t<7.4)||t>=45.4;showroom.visible=S2;hero.visible=S3;uni.visible=S4;studio.visible=S5;finale.visible=t>=45.4;
  floor.visible=t>4.3&&!(t>34.8&&t<42.5)&&!(t>44&&t<45.4);
  // background
  let bg=bgBlack.clone();
  if(t>4.3&&t<34.9)bg=bgBlack.clone().lerp(bgWhite,ease(seg(t,4.2,4.9)));
  if(t>=34.9&&t<44){bg=bgWhite.clone().lerp(bgNavy,ease(seg(t,34.9,36.0)));if(t>42)bg=bgNavy.clone().lerp(bgWhite,ease(seg(t,42,43.6)));}
  if(t>=44)bg=bgBlack.clone().lerp(bgWhite,ease(seg(t,45.3,46.0)));
  scene.background.copy(bg);if(!scene.fog)scene.fog=new THREE.Fog(0xffffff,14,60);scene.fog.color.copy(bg);scene.fog.near=(t>1&&t<4.9)?400:14;scene.fog.far=(t>1&&t<4.9)?500:60;
  const whiteish=bg.r>.5;floorMat.color.set(whiteish?0xf7f8fb:0x0c1430);
  rimO.intensity=(t>34.8&&t<44)?40:(whiteish?6:0);rimN.intensity=(t>34.8&&t<44)?25:(whiteish?4:0);
  key.intensity=whiteish?1.6:1.1;
  bloom.strength=whiteish?.18:.7;bloom.threshold=whiteish?1.05:(t>34.8&&t<44?.98:.6);renderer.toneMappingExposure=whiteish?.92:1.0;

  // ===== SCENE 1 =====
  if(t<7.6){
    const k0=seg(t,.5,1.2);seedSpark.scale.setScalar(.05+.6*ease(k0)+.08*Math.sin(t*30)*k0);seedSpark.position.set(0,0,-3);seedSpark.material.opacity=k0*(1-seg(t,1.2,1.4));
    // particles: explode (1.2-2.2), flow as tunnel walls (2.2-4.6), dissipate, then reform as logo (4.6-6.2) then hide
    const ex=easeOut(seg(t,1.2,2.4));const tun=ease(seg(t,2.0,3.2));const toLogo=ease(seg(t,4.5,6.0));const camZ=-lerp(0,42,ease(seg(t,1.4,4.6)));
    for(let i=0;i<NP;i++){const d=pDir[i],sp=pSpd[i];
      let x=d.x*sp*ex*3,y=d.y*sp*ex*3,z=-3+d.z*sp*ex*3;
      if(tun>0){const a=Math.atan2(d.y,d.x)+t*.4*(i%2?1:-1),rr=2.0+sp*.8;const tz=-((i*0.37)%60)-3;x=lerp(x,Math.cos(a)*rr,tun);y=lerp(y,Math.sin(a)*rr,tun);z=lerp(z,tz,tun);}
      if(toLogo>0){const L=logoPts[i];x=lerp(x+0,L.x,toLogo);y=lerp(y,L.y+2.1,toLogo);z=lerp(z+(t<4.6?0:-camZ*0),L.z,toLogo);}
      pPos[i*3]=x;pPos[i*3+1]=y+(tun>0&&toLogo<1?0:0);pPos[i*3+2]=z;}
    pGeo.attributes.position.needsUpdate=true;pMat.opacity=(1-seg(t,6.0,6.8));pMat.size=t<4.5?.05:.035;
    tunnel.children.forEach(r=>{if(r.userData.sp)r.rotation.z=t*r.userData.sp;r.material.opacity=seg(t,1.2,1.8)*(1-seg(t,4.2,4.8));});
    // camera
    if(t<4.6){camera.position.set(Math.sin(t*.7)*.15,Math.cos(t*.5)*.1,lerp(2,camZ,1));camera.lookAt(0,0,camera.position.z-6);}
    else{const k=ease(seg(t,4.6,7.3));camera.position.set(0,lerp(2.6,2.3,k),lerp(6.5,5.2,k));camera.lookAt(0,2.1,0);}
    // shockwave
    const sk=seg(t,3.9,5.2);shock.position.set(0,camera.position.y,camera.position.z-3);shock.lookAt(camera.position);shock.scale.setScalar(.2+sk*9);shock.material.opacity=Math.sin(sk*Math.PI)*.9;
    // logo letters assemble
    logo.position.set(0,2.1,0);logo.scale.setScalar(LS);
    logo.userData.letters.forEach((m,i)=>{const k=back(seg(t,4.7+i*.12,5.6+i*.12));const h=m.userData.home;const st=V(Math.sin(i*1.7)*6,Math.cos(i*2.3)*5,-6-i);
      m.position.copy(st.clone().lerp(h,k));m.rotation.set((1-k)*3*(i%2?1:-1),(1-k)*4,0);m.visible=seg(t,4.7+i*.12,4.75+i*.12)>0;});
    logo.rotation.y=Math.sin(t*.8)*.12*seg(t,6,7.3);
    floorGlow.material.opacity=seg(t,5.2,6)*(1-seg(t,7,7.3));floorGlow.scale.setScalar(1+seg(t,5.2,7)*.4);
  }

  // ===== SCENE 2 =====
  if(S2){const lt=t-6.8;
    plats.forEach((P,i)=>{const r=easeOut(seg(lt,.3+i*.35,1.3+i*.35));P.g.position.y=lerp(-1.2,0,r);
      const ap=seg(lt,1.0+i*.55,2.0+i*.55);P.portal.scale.setScalar(.2+back(ap)*1.0);P.portal.material.opacity=1;P.portal.visible=ap>0&&ap<1;P.portalGlow.material.opacity=Math.sin(ap*Math.PI)*.9;P.portalGlow.visible=ap>0&&ap<1;
      const s=back(seg(lt,1.4+i*.55,2.2+i*.55));P.holder.scale.setScalar(Math.max(.001,s));P.holder.rotation.y=lt*1.1+i;P.holder.position.y=.5+P.prod.userData.h/2+.18+Math.sin(lt*2+i)*.05;
      P.ring.material.opacity=r;});
    const k=ease(seg(lt,0,9.4));camera.position.set(lerp(0,.3,k),lerp(3.4,2.4,k),lerp(4.5,-4.2,k));camera.lookAt(lerp(0,0,k),lerp(1.1,1.0,k),lerp(-3,-10.5,k));}

  // ===== SCENE 3 =====
  if(S3){const lt=t-15.8;const ang=lt/9.5*Math.PI*2;
    camera.position.set(Math.sin(ang)*3.4,1.9+Math.sin(lt*.6)*.15,Math.cos(ang)*3.4);camera.lookAt(0,1.45,0);
    heroRings.forEach((r,i)=>{r.rotation.x=Math.PI/2+Math.sin(lt*.7+i)*.5;r.rotation.y=lt*(.4+i*.2);r.material.opacity=.85;});
    const T=[0,2.2,4.4,6.4,8.0,9.5];// stage boundaries (local)
    let active=-1,morph=0,from=0,to=0;
    for(let s=0;s<5;s++){if(lt>=T[s]&&lt<T[s+1])active=s;}
    heroProds.forEach((h,i)=>{h.visible=false;});
    const MT=.9;// morph time at end of each stage
    if(active>=0){const h=heroProds[active];const st=T[active],en=T[active+1];const inK=back(seg(lt,st,st+.5));const outK=seg(lt,en-MT,en-MT+.35);
      h.visible=outK<1;h.scale.setScalar(1.25*Math.max(.001,active===0?back(seg(lt,.2,.9)):inK)*(1-outK));h.rotation.y=lt*1.3;
      if(active<4&&lt>en-MT){const k=ease(seg(lt,en-MT,en));const A=heroSamples[active],B=heroSamples[active+1];morphPts.visible=true;
        camera.updateMatrixWorld();camR.setFromMatrixColumn(camera.matrixWorld,0);camU.setFromMatrixColumn(camera.matrixWorld,1);const fw=V(0,0,0).setFromMatrixColumn(camera.matrixWorld,2);
        const cO2=new THREE.Color(ORANGE);
        for(let i=0;i<NM;i++){const a=A[i],b=B[i];const sw=Math.sin(k*Math.PI);const x=lerp(a.x,b.x,k),y=lerp(a.y+a.cy,b.y+b.cy,k);
          const ox=Math.sin(i*1.3+lt*4)*.5*sw,oy=sw*(.4+Math.cos(i)*.4)*.6,oz=Math.cos(i*.7+lt*4)*.5*sw;
          mPos[i*3]=camR.x*x+ox+fw.x*oz;mPos[i*3+1]=y+oy;mPos[i*3+2]=camR.z*x+fw.z*oz+camR.z*0;
          const m2=sw*.6;mCol[i*3]=lerp(lerp(a.r,b.r,k),cO2.r,m2);mCol[i*3+1]=lerp(lerp(a.g,b.g,k),cO2.g,m2);mCol[i*3+2]=lerp(lerp(a.b,b.b,k),cO2.b,m2);}
        mGeo.attributes.position.needsUpdate=true;mGeo.attributes.color.needsUpdate=true;morphPts.material.opacity=1;}
      else morphPts.visible=false;}
  }

  // ===== SCENE 4 =====
  if(S4){const lt=t-24.8;
    shelfItems.forEach(s=>{const k=back(seg(lt,.4+s.delay,1.1+s.delay));s.holder.scale.setScalar(.46*Math.max(.001,k));s.holder.rotation.y=lt*.8;
      const tk=seg(lt,s.delay,.9+s.delay);s.trail.material.opacity=Math.sin(tk*Math.PI)*.9;s.trail.position.y=s.holder.position.y+lerp(2.2,.6,tk);});
    const k=ease(seg(lt,0,6.3));camera.position.set(Math.sin(lt*.5)*.25,lerp(3.0,2.6,k),lerp(4,-2.5,k));camera.lookAt(0,lerp(2.0,2.3,k),lerp(-6,-9,k));
    // bag assembles 5.4-7.6
    const bk=ease(seg(lt,5.2,7.4));bagParts.visible=lt>5.0&&lt<7.9;
    if(bagParts.visible){for(let i=0;i<NM;i++){const a=bagStart[i],b=bagPts[i];bPPos[i*3]=lerp(a.x,b.x,bk);bPPos[i*3+1]=lerp(a.y,b.y,bk);bPPos[i*3+2]=lerp(a.z,b.z,bk);}bPGeo.attributes.position.needsUpdate=true;bagParts.material.opacity=1-seg(lt,7.2,7.9);}
    uniBag.visible=lt>7.0;uniBag.scale.setScalar(1.1*back(seg(lt,7.0,7.6)));uniBag.rotation.y=Math.sin(lt*.8)*.3;
    icons.forEach((s,i)=>{const ik=easeOut(seg(lt,7.8+i*.18,9.2+i*.18));const a=-Math.PI/2+(i-2.5)*.42;s.visible=ik>0;
      s.position.set(uniBag.position.x+Math.cos(a+Math.PI/2)*ik*2.2*Math.sign(i-2.5||1)*.0+ (i-2.5)*.75*ik,uniBag.position.y+1.3+ik*(1.2+Math.abs(i-2.5)*-.18),uniBag.position.z+.4);
      s.material.opacity=ik*(1-seg(lt,10.2,10.5));s.scale.setScalar(.2+.8*ik);});
  }

  // ===== SCENE 5 =====
  if(S5){const lt=t-34.8;const ang=-.6+lt/9.5*Math.PI*1.1;
    camera.position.set(Math.sin(ang)*6.2,2.9+Math.sin(lt*.4)*.3,Math.cos(ang)*6.2);camera.lookAt(0,2.0,0);
    bigBag.rotation.y=lt*.25;bigBag.scale.setScalar(1.55*back(seg(lt,.2,1.1)));
    ringProds.forEach((h,i)=>{const a=i/6*Math.PI*2+lt*.35;const k=back(seg(lt,.5+i*.15,1.4+i*.15));h.position.set(Math.cos(a)*2.9,2.0+Math.sin(a*2+lt)*.25,Math.sin(a)*2.9);h.scale.setScalar(.75*Math.max(.001,k));h.rotation.y=lt*.9+i;});
    ribbons.forEach((r,i)=>{const n=r.geometry.index.count;const k=ease(seg(lt,.8+i*.4,4.5+i*.4));r.geometry.setDrawRange(0,Math.floor(n*k));r.rotation.y=lt*.25*(i%2?-1:1);});
    studioGlow.material.opacity=.55*(1-seg(lt,7.2,8.8));
  }

  // ===== SCENE 6 =====
  if(t>=44){const lt=t-44;
    // particles reform into logo from a burst (44.6-46)
    if(t<46.2){const k=ease(seg(lt,.7,1.9));for(let i=0;i<NP;i++){const d=pDir[i],L=logoPts[i];const r0=6+pSpd[i]*4;
        pPos[i*3]=lerp(d.x*r0,L.x,k);pPos[i*3+1]=lerp(d.y*r0+2.4,L.y+2.4,k);pPos[i*3+2]=lerp(d.z*r0,L.z,k);}
      pGeo.attributes.position.needsUpdate=true;pMat.opacity=seg(lt,.5,.9)*(1-seg(lt,1.7,2.2));pMat.size=.035;}
    logo.position.set(0,2.4,0);logo.userData.letters.forEach(m=>{m.position.copy(m.userData.home);m.rotation.set(0,0,0);m.visible=true;});
    const lk=back(seg(lt,1.4,2.2));logo.scale.setScalar(LS*Math.max(.001,lk));logo.rotation.y=Math.sin(lt*.8)*.08;
    finProds.forEach((h,i)=>{const k=back(seg(lt,2.0+i*.12,2.8+i*.12));const p=FIN_POS[i];h.position.set(p[0],2.4+p[1]-.2,p[2]);h.scale.setScalar(.48*Math.max(.001,k));h.rotation.y=lt*.7+i;});
    camera.position.set(0,2.2,lerp(7.6,7.0,ease(seg(lt,1,6))));camera.lookAt(0,1.75,0);
    floorGlow.material.opacity=seg(lt,1.6,2.4)*.8;floorGlow.scale.setScalar(1.15);
  }
  // overlays
  const bl=document.getElementById('black');bl.style.opacity=t<44?0:(t<44.5?seg(t,44,44.15):1-seg(t,44.5,45.6));
  const wv=document.getElementById('wave');const wk=seg(t,44.4,45.6);wv.style.opacity=wk>0&&wk<1?1:0;wv.style.left=lerp(-160,100,ease(wk))+'%';
  const wt=document.getElementById('white');wt.style.opacity=Math.max(seg(t,49.2,50)*1, (t>4.0&&t<4.9)?Math.sin(seg(t,4.0,4.9)*Math.PI)*.85:0, (t>45.2&&t<46)?Math.sin(seg(t,45.2,46)*Math.PI)*.4:0);
  [['w1',46.6],['w2',47.1],['w3',47.6],['w4',48.1]].forEach(([id,a])=>{const e=document.getElementById(id);const k=easeOut(seg(t,a,a+.5));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*18}px)`;});
  document.getElementById('vig').style.opacity=whiteish?.25:1;
  composer.render();
};
window.DUR=DUR;
window.READY=true;
